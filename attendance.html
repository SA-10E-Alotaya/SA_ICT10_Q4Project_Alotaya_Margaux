<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracker</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>

    <py-config>
        packages = ["numpy", "matplotlib"]
    </py-config>

    <style>
        :root {
            color-scheme: light;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, sans-serif;
            background: #7c9182;
            color: #111827;
        }
        .topbar {
            background: linear-gradient(90deg, #4f826c, #6aa88a);
            color: white;
            padding: 0.85rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .brand {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-weight: 600;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: white;
        }
        .nav-links a.active {
            font-weight: 800;
        }
        .page-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem 3rem;
        }
        .tracker-card {
            width: min(420px, 100%);
            background-color: #cff0cc;
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.14);
            padding: 2rem;
        }
        .btn-custom {
            background-color: #71d888;
            color: white;
            border: none;
        }
        .btn-custom:hover {
            background-color: #23c839;
        }
        .title-text {
            color: #319968;
            font-weight: bold;
        }
        #output {
            background-color: #28a745;
            color: white;
            border-radius: 10px;
        }
        @media (max-width: 576px) {
            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }
            .nav-links {
                width: 100%;
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">10-Emerald</div>
        <nav class="nav-links">
            <a href="Classmates.html">Classmates</a>
            <a class="active" href="attendance.html">Attendance Tracker</a>
            <a href="index.html#gallery">Gallery</a>
        </nav>
    </header>

    <main class="page-wrapper">
        <div class="tracker-card">
            <h3 class="text-center title-text mb-4">Attendance Tracker</h3>
            <form>
                <div class="mb-3">
                    <label class="form-label fw-bold">Select Day</label>
                    <select id="dayOfTheWeek" class="form-select">
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Absences</label>
                    <input type="number" id="absences" class="form-control" placeholder="Enter number of absences">
                </div>
                <div class="d-grid">
                    <input type="button" py-click="displaying" value="Submit" class="btn btn-custom btn-lg">
                </div>
            </form>
            <div id="output" class="mt-3 p-2 text-center fs-5"></div>
        </div>
    </main>

    <py-script src="http://127.0.0.1:5000/api/attendance-script"></py-script>
</body>
</html>
